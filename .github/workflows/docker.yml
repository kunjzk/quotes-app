name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Build Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/quotes-app:${{ github.sha }}
          docker build -t $IMAGE_NAME .
          skopeo copy docker-daemon:$IMAGE_NAME docker-archive:quotes-image.tar

      - name: Save image to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quotes-app
          path: quotes-image.tar

  test:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: quotes-app
          path: ./artifacts

      - name: Run tests
        run: |
          skopeo copy docker-archive:./artifacts/quotes-image.tar docker-daemon:quotes-app:latest
          docker run --network host \
            -e POSTGRES_NAME=testdb \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e DJANGO_SECRET_KEY=test-secret-key-for-ci \
            -e DJANGO_DEBUG_MODE=False \
            -e CELERY_BROKER_URL=redis://localhost:6379 \
            quotes-app:latest python manage.py test

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: quotes-app
          path: ./artifacts

      - name: Copy Docker image to GHCR
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/quotes-app
          skopeo copy --dest-creds ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} docker-archive:./artifacts/quotes-image.tar docker://${IMAGE_NAME}:latest
          skopeo copy --dest-creds ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} docker-archive:./artifacts/quotes-image.tar docker://${IMAGE_NAME}:${{ github.sha }}
