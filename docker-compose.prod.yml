# Production Docker Compose configuration (without MailHog)
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  quotes-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  
  quotes-redis:
    image: redis:latest
    restart: unless-stopped
  
  # TLS terminator. Cloudflare is the only thing that should reach this,
  # enforced by the security group.
  quotes-caddy:
    image: caddy:2-alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/caddy/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    depends_on:
      - quotes-app
    restart: unless-stopped

  # No host port mapping: reachable only via Caddy on the compose network.
  quotes-app:
    image: ${QUOTES_IMAGE:-ghcr.io/kunjzk/quotes-app:latest}
    expose:
      - 8000
    depends_on:
      - quotes-postgres
      - quotes-redis
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_NAME: ${POSTGRES_NAME}
      POSTGRES_HOST: quotes-postgres
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG_MODE: ${DJANGO_DEBUG_MODE}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CELERY_BROKER_URL: redis://quotes-redis:6379
      EMAIL_BACKEND: ${EMAIL_BACKEND}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      # Seeded on start by entrypoint.sh. Set these to override the weak
      # defaults; passwords only apply when an account is first created.
      APP_DOMAIN: ${APP_DOMAIN}
      DJANGO_ADMIN_USERNAME: ${DJANGO_ADMIN_USERNAME:-admin}
      DJANGO_ADMIN_PASSWORD: ${DJANGO_ADMIN_PASSWORD:-admin}
      DJANGO_USER_USERNAME: ${DJANGO_USER_USERNAME:-kunal}
      DJANGO_USER_PASSWORD: ${DJANGO_USER_PASSWORD:-kunal}
    restart: unless-stopped
  
  quotes-celery-worker:
    image: ${QUOTES_IMAGE:-ghcr.io/kunjzk/quotes-app:latest}
    command: celery -A quotesapp worker -l info
    depends_on:
      - quotes-postgres
      - quotes-redis
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_NAME: ${POSTGRES_NAME}
      POSTGRES_HOST: quotes-postgres
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG_MODE: ${DJANGO_DEBUG_MODE}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CELERY_BROKER_URL: redis://quotes-redis:6379
      EMAIL_BACKEND: ${EMAIL_BACKEND}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
    restart: unless-stopped
  
  quotes-celery-beat:
    image: ${QUOTES_IMAGE:-ghcr.io/kunjzk/quotes-app:latest}
    command: celery -A quotesapp beat -l info
    depends_on:
      - quotes-postgres
      - quotes-redis
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_NAME: ${POSTGRES_NAME}
      POSTGRES_HOST: quotes-postgres
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG_MODE: ${DJANGO_DEBUG_MODE}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CELERY_BROKER_URL: redis://quotes-redis:6379
      EMAIL_BACKEND: ${EMAIL_BACKEND}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
