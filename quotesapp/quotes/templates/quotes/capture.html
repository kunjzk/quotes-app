{% extends 'base.html' %}

{% block title %}Capture · ReadReadRead{% endblock %}

{% block content %}
<div class="capture">
    {% include 'quotes/partials/capture_modes.html' %}

    <form id="capture-form" data-suggest-url="{% url 'quotes:source_suggest' %}" data-shelf-url="{% url 'quotes:shelf' %}">
        {% csrf_token %}
        <div class="sheet">
            <textarea id="quote-input" name="content" rows="6" placeholder="Paste or type a passage" aria-label="Passage" autofocus></textarea>

            <div class="attrline">
                <span class="dash" aria-hidden="true">—</span>
                <input id="attr-input" type="text" placeholder="book | author | p. 42" autocomplete="off" spellcheck="false"
                       aria-label="Book, author and page" aria-autocomplete="list" aria-controls="source-pop">
                <div class="source-pop" id="source-pop" role="listbox" hidden></div>
            </div>
            <div class="parsed" id="parsed" aria-live="polite"></div>
        </div>

        <div class="capfoot">
            <button type="button" class="ghost" id="clear-button">Clear</button>
            <button type="submit" class="save" id="save-button">Save passage <kbd>⌘↵</kbd></button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    (() => {
        const form = document.getElementById('capture-form');
        const textInput = document.getElementById('quote-input');
        const attrInput = document.getElementById('attr-input');
        const pop = document.getElementById('source-pop');
        const parsed = document.getElementById('parsed');
        const saveButton = document.getElementById('save-button');
        const csrfToken = form.querySelector('[name=csrfmiddlewaretoken]').value;

        if (/Mac|iPhone|iPad/.test(navigator.platform) === false) {
            saveButton.querySelector('kbd').textContent = 'Ctrl ↵';
        }

        // Mirrors CaptureView's parser: "title | creator | p. 42", every part but the title optional.
        function parseAttribution(value) {
            let rest = value.trim().replace(/^[—-]\s*/, '');
            let page = null;
            const pageMatch = rest.match(/\b(?:p\.?|page)\s*(\d+)/i);
            if (pageMatch) {
                page = pageMatch[1];
                rest = rest.replace(/\s*\b(?:p\.?|page)\s*\d+/gi, '').trim();
            }
            const [title = '', creator = ''] = rest.split('|').map((part) => part.trim());
            return { title, creator, page };
        }

        let suggestions = [];
        let highlighted = -1;
        let requestId = 0;
        let debounce;

        function renderParsed() {
            const { title, creator, page } = parseAttribution(attrInput.value);
            if (!title) {
                parsed.innerHTML = '<span>Book, then optionally author and page. Only the book is required.</span>';
                return;
            }
            const known = suggestions.find((s) => s.title.toLowerCase() === title.toLowerCase());
            const bits = [];
            if (known) {
                bits.push('<span class="dot"></span>', `<span>${escapeHtml(known.title)}</span>`);
                if (known.creator) bits.push('<span>·</span>', `<span>${escapeHtml(known.creator)}</span>`);
            } else {
                bits.push('<span class="new">New to your shelf</span>', `<span>${escapeHtml(title)}</span>`);
                if (creator) bits.push('<span>·</span>', `<span>${escapeHtml(creator)}</span>`);
            }
            if (page) bits.push('<span>·</span>', `<span>p. ${escapeHtml(page)}</span>`);
            parsed.innerHTML = bits.join('');
        }

        function closePop() {
            pop.hidden = true;
            highlighted = -1;
        }

        function renderPop() {
            const { title } = parseAttribution(attrInput.value);
            const options = suggestions.filter((s) => s.title.toLowerCase() !== title.toLowerCase());
            if (!title || !options.length || document.activeElement !== attrInput) {
                closePop();
                return;
            }
            pop.innerHTML = options.map((s, i) => `
                <button type="button" role="option" data-title="${escapeHtml(s.title)}" class="${i === highlighted ? 'hi' : ''}">
                    <span>${escapeHtml(s.title)}</span><span>${escapeHtml(s.creator || 'Unknown author')}</span>
                </button>`).join('');
            pop.hidden = false;
        }

        async function loadSuggestions() {
            const { title } = parseAttribution(attrInput.value);
            const id = ++requestId;
            if (title.length < 2) {
                suggestions = [];
                renderPop();
                renderParsed();
                return;
            }
            try {
                const response = await fetch(`${form.dataset.suggestUrl}?q=${encodeURIComponent(title)}`, { headers: { Accept: 'application/json' } });
                if (!response.ok) return;
                const data = await response.json();
                if (id !== requestId) return;
                suggestions = data.suggestions || [];
            } catch {
                suggestions = [];
            }
            renderPop();
            renderParsed();
        }

        function chooseSource(title) {
            const { page } = parseAttribution(attrInput.value);
            attrInput.value = title + (page ? ` p. ${page}` : '');
            closePop();
            renderParsed();
        }

        attrInput.addEventListener('input', () => {
            highlighted = -1;
            renderParsed();
            clearTimeout(debounce);
            debounce = setTimeout(loadSuggestions, 150);
        });
        attrInput.addEventListener('focus', renderPop);
        attrInput.addEventListener('blur', () => setTimeout(closePop, 120));
        attrInput.addEventListener('keydown', (e) => {
            const options = [...pop.querySelectorAll('button')];
            if (pop.hidden || !options.length) return;
            if (e.key === 'ArrowDown') { e.preventDefault(); highlighted = (highlighted + 1) % options.length; renderPop(); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); highlighted = (highlighted - 1 + options.length) % options.length; renderPop(); }
            else if (e.key === 'Enter' && highlighted >= 0 && !(e.metaKey || e.ctrlKey)) { e.preventDefault(); chooseSource(options[highlighted].dataset.title); }
            else if (e.key === 'Escape') { e.preventDefault(); closePop(); }
        });
        pop.addEventListener('mousedown', (e) => {
            const option = e.target.closest('button');
            if (!option) return;
            e.preventDefault();
            chooseSource(option.dataset.title);
        });

        function clearForm() {
            textInput.value = '';
            attrInput.value = '';
            suggestions = [];
            closePop();
            renderParsed();
            textInput.focus();
        }
        document.getElementById('clear-button').addEventListener('click', clearForm);

        // A pasted passage that ends with "— title | creator" fills in the attribution line.
        textInput.addEventListener('paste', () => setTimeout(() => {
            const lines = textInput.value.trimEnd().split('\n');
            const last = lines[lines.length - 1].trim();
            if (lines.length > 1 && /^[—-]\s*\S/.test(last) && !attrInput.value.trim()) {
                attrInput.value = last.replace(/^[—-]\s*/, '');
                textInput.value = lines.slice(0, -1).join('\n').trimEnd();
                loadSuggestions();
            }
        }));

        async function save() {
            const text = textInput.value.trim();
            const { title } = parseAttribution(attrInput.value);
            if (!text) { toast('Add the passage text first', { error: true }); textInput.focus(); return; }
            if (!title) { toast('Add a book on the attribution line', { error: true }); attrInput.focus(); return; }

            saveButton.disabled = true;
            try {
                const response = await fetch(window.location.pathname, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': csrfToken },
                    body: new URLSearchParams({ content: `${text}\n— ${attrInput.value.trim()}` }),
                });
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error(data.error || 'Could not save the passage. Try again.');
                toast(data.message === 'Quote already exists'
                    ? `Already on your shelf in ${data.source_title}`
                    : `Saved to ${data.source_title}`);
                // Keep the attribution so several passages from one source are quick to add.
                textInput.value = '';
                textInput.focus();
            } catch (err) {
                toast(err.message, { error: true });
            } finally {
                saveButton.disabled = false;
            }
        }

        form.addEventListener('submit', (e) => { e.preventDefault(); save(); });
        [textInput, attrInput].forEach((el) => el.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); save(); }
        }));

        renderParsed();
        if (location.hash === '#voice') document.getElementById('voice-button').focus();
    })();
</script>

<script type="module">
    // Voice dictation. The Whisper library and model load on first use, not on page load.
    const voiceButton = document.getElementById('voice-button');
    const voiceStatus = document.getElementById('voice-status');
    const input = document.getElementById('quote-input');

    let whisper = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let recording = false;

    function setRecording(on) {
        recording = on;
        voiceButton.classList.toggle('is-recording', on);
        voiceButton.setAttribute('aria-pressed', String(on));
        voiceStatus.textContent = on ? 'Stop' : 'Voice';
    }

    async function initWhisper() {
        if (!whisper) {
            toast('Loading the speech model. This takes a while the first time.');
            const { BrowserWhisper } = await import('https://esm.sh/browser-whisper@1.0.1');
            whisper = new BrowserWhisper({ model: 'whisper-base' });
        }
        return whisper;
    }

    async function startRecording() {
        let stream;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch {
            toast('Microphone access is blocked. Allow it in your browser settings.', { error: true });
            return;
        }
        try {
            await initWhisper();
        } catch (error) {
            console.error('Failed to load Whisper:', error);
            stream.getTracks().forEach((track) => track.stop());
            toast('Could not load the speech model.', { error: true });
            return;
        }

        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
        mediaRecorder.onstop = async () => {
            stream.getTracks().forEach((track) => track.stop());
            await transcribe(new Blob(audioChunks, { type: 'audio/webm' }));
        };
        mediaRecorder.start();
        setRecording(true);
        toast('Listening. Tap Stop when you finish.');
    }

    async function transcribe(audioBlob) {
        toast('Transcribing…');
        try {
            const file = new File([audioBlob], 'recording.webm', { type: 'audio/webm' });
            let transcription = '';
            for await (const { text } of whisper.transcribe(file)) transcription += text + ' ';
            const current = input.value.trim();
            input.value = current ? `${current}\n\n${transcription.trim()}` : transcription.trim();
            input.focus();
            toast('Transcribed. Edit as needed, then save.');
        } catch (error) {
            console.error('Transcription error:', error);
            toast('Transcription failed. Try again.', { error: true });
        }
    }

    voiceButton.addEventListener('click', async () => {
        if (!recording) {
            await startRecording();
        } else if (mediaRecorder) {
            mediaRecorder.stop();
            setRecording(false);
        }
    });
</script>
{% endblock %}
